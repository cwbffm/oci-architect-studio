name: Validate Studio
on:
  pull_request:
  push:
    branches: [docker-compose, 'feature/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: python tools/build_frontend.py --check
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -c backend/pytest.ini -q
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          export CHROMIUM_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          npm test
          npm run test:themes
